# Render Blueprint: optional, lets Render create the service from this repo automatically.
services:
  - type: web
    name: mimipop
    runtime: docker
    # "free" sleeps after ~15 minutes idle (live matches drop, first visit is slow).
    # Use "starter" for an always-on server.
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false   # you paste the value in the Render dashboard; never commit it
      - key: MONGODB_DATABASE
        value: mimipop
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
